<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalender Pribadi Dinamis & Evaluasi Mingguan (Al-Bayan Goalpara)</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/modal.css">

  <meta name="description" content="Aplikasi Kalender Produktivitas Pribadi Dinamis Berbasis Waktu Sholat dan Evaluasi Mingguan (Al-Bayan Goalpara)">
  <meta name="theme-color" content="#2563EB">
</head>
<body>

  <div class="app-container">
    <!-- Header Section -->
    <header class="app-header">
      <div class="header-top">
        <div class="brand-section">
          <div class="brand-logo">📅</div>
          <div class="brand-info">
            <h1>Kalender Pribadi Al-Bayan</h1>
            <div class="location-tag">
              <span>📍 SMA Albayan Goalpara, Sukabumi</span>
              <span>•</span>
              <span id="prayer-sync-status">Waktu Sholat Aktif</span>
            </div>
          </div>
        </div>

        <div class="header-actions">
          <button class="btn btn-outline btn-sm" id="export-btn" title="Download backup JSON">
            💾 Backup JSON
          </button>
          <button class="btn btn-outline btn-sm" id="import-btn" title="Restore dari file JSON">
            📥 Import JSON
          </button>
          <input type="file" id="import-file-input" accept=".json" style="display: none;">

          <button class="btn btn-outline btn-sm" id="theme-toggle-btn">
            🌙 Gelap
          </button>
        </div>
      </div>

      <!-- Prayer Times Dynamic Ribbon -->
      <div class="prayer-ribbon" id="prayer-ribbon">
        <!-- Injected via JavaScript -->
      </div>
    </header>

    <!-- Ratio Tracker Card (80:10:10 Philosophy) -->
    <section class="ratio-tracker-card">
      <div class="ratio-header">
        <span class="ratio-title">
          ⚖️ Keseimbangan Waktu Mingguan
        </span>
        <div class="ratio-legend" id="ratio-legend">
          <!-- Injected via JavaScript -->
        </div>
      </div>
      <div class="ratio-bar-container" id="ratio-bar">
        <!-- Injected via JavaScript -->
      </div>
    </section>

    <!-- Navigation & Control Toolbar -->
    <section class="toolbar-section">
      <!-- Date Nav -->
      <div class="date-nav-group">
        <button class="nav-btn" id="nav-today-btn">Hari Ini</button>
        <button class="nav-btn" id="nav-prev-btn">◀</button>
        <div class="current-week-label" id="current-week-label">Minggu Ini</div>
        <button class="nav-btn" id="nav-next-btn">▶</button>
      </div>

      <!-- Action Buttons -->
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="btn btn-outline" id="auto-gen-btn" title="Reset dan generate ulang jadwal minggu ini ke template default">
          ⚡ Reset ke Default
        </button>
        <button class="btn btn-outline" id="weekly-review-btn" title="Buka dashboard evaluasi retrospektif mingguan">
          📊 Evaluasi Mingguan
        </button>
        <button class="btn btn-primary" id="add-event-btn">
          ➕ Tambah Jadwal
        </button>
      </div>

      <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
        <!-- Zoom Density Switcher -->
        <div class="view-mode-tabs" id="density-switch-group" title="Atur Tinggi Waktu / Kerapatan">
          <button class="tab-btn" data-density="60">Padat</button>
          <button class="tab-btn active" data-density="80">Normal</button>
          <button class="tab-btn" data-density="105">Luas</button>
        </div>

        <!-- View Switcher Tabs -->
        <div class="view-mode-tabs">
          <button class="tab-btn active" data-view="week">Mingguan (Grid)</button>
          <button class="tab-btn" data-view="day">Harian (Fokus)</button>
          <button class="tab-btn" data-view="agenda">Agenda (List)</button>
        </div>
      </div>
    </section>

    <!-- Category Filter Ribbon -->
    <div class="category-filter-bar" id="category-filter-bar">
      <button class="filter-chip active" data-cat="all">🌟 Semua Kategori</button>
      <button class="filter-chip" data-cat="teaching">👨‍🏫 Mengajar MTU/PM</button>
      <button class="filter-chip" data-cat="class">👥 Kelas/Club/Takhosus</button>
      <button class="filter-chip" data-cat="prayer">🕌 Sholat & Tugas</button>
      <button class="filter-chip" data-cat="habit">⭐ Floating Habits</button>
      <button class="filter-chip" data-cat="prep">📖 Persiapan (Prep)</button>
      <button class="filter-chip" data-cat="routine">🍽️ Rutinitas (Makan/Mandi)</button>
    </div>

    <!-- Main Calendar Area -->
    <main class="main-view-area" id="calendar-view-container">
      <!-- Calendar Grid / Daily / Agenda View Injected via JS -->
    </main>
  </div>

  <!-- Modals Container -->
  <div class="modal-overlay" id="logger-modal"></div>
  <div class="modal-overlay" id="editor-modal"></div>
  <div class="modal-overlay" id="review-modal"></div>

  <!-- App Entrypoint Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
